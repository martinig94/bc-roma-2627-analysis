name: Collect LBA 2026/27 data

on:
  schedule:
    # Every Monday 06:10 UTC (08:10 Rome) — after the weekend round.
    # Midweek rounds (turni infrasettimanali) get picked up the following Monday,
    # or run it by hand from the Actions tab.
    - cron: "10 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect new games
        id: collect
        continue-on-error: true   # commit whatever was collected even if some games failed
        run: python -m lba_data.collect

      - name: Weekly report for the new rounds
        id: weekly
        continue-on-error: true   # a report problem must not block committing the data
        run: python notebooks/weekly.py

      - name: Commit updated data and reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports weekly docs
          if git diff --cached --quiet; then
            echo "no new games"
          else
            n=$(git diff --cached --numstat -- data/raw | wc -l)
            git commit -m "data and weekly report: collect $(date -u +%Y-%m-%d) (${n} raw files changed)"
            git push
          fi

      - name: Fail the run if the collector or the report reported errors
        if: steps.collect.outcome == 'failure' || steps.weekly.outcome == 'failure'
        run: exit 1
